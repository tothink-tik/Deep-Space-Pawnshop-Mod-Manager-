name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build DangpuZhanggui/DangpuZhanggui.csproj -c Release
      - name: Publish single-file
        run: dotnet publish DangpuZhanggui/DangpuZhanggui.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: DeepSpacePawnshopModManager-1.0.0-Beta
          path: out
